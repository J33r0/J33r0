<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1060" height="300" rx="14" fill="#0d0117"/>

  <!-- k3s cluster -->
  <rect x="15" y="125" width="890" height="150" rx="12" fill="#160726" stroke="#7f04a2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="30" y="148" fill="#c084fc" font-size="13" font-weight="700">k3s cluster · 3 nodes · etcd</text>

  <!-- Row 1 -->
  <g font-size="14" fill="#f3e8ff" text-anchor="middle">
    <rect x="30" y="30" width="140" height="50" rx="25" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="100" y="60">git push</text>

    <rect x="210" y="30" width="140" height="50" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="280" y="52">GitHub Actions</text>
    <text x="280" y="70" font-size="11" fill="#d8b4fe">build + version</text>

    <rect x="390" y="30" width="140" height="50" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="460" y="52">GHCR</text>
    <text x="460" y="70" font-size="11" fill="#d8b4fe">Docker images</text>

    <rect x="750" y="30" width="140" height="50" rx="8" fill="#1e0b36" stroke="#a855f7" stroke-width="1.5"/>
    <text x="820" y="52">Ansible</text>
    <text x="820" y="70" font-size="11" fill="#d8b4fe">+ Vault secrets</text>
  </g>

  <!-- Row 2 (inside cluster) -->
  <g font-size="14" fill="#f3e8ff" text-anchor="middle">
    <polygon points="45,180 155,180 170,210 155,240 45,240 30,210" fill="#7f04a2" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="100" y="206">Virtual IP</text>
    <text x="100" y="224" font-size="10" fill="#f3e8ff">keepalived/VRRP</text>

    <rect x="210" y="180" width="140" height="60" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="280" y="215">Traefik</text>

    <rect x="390" y="180" width="140" height="60" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="460" y="215">App</text>

    <rect x="570" y="180" width="140" height="60" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="577" y="187" width="126" height="46" rx="5" fill="none" stroke="#a855f7" stroke-width="1"/>
    <text x="640" y="215">RabbitMQ</text>

    <rect x="750" y="180" width="140" height="60" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="820" y="215">Celery worker</text>
  </g>

  <!-- S3 (cylinder) -->
  <g fill="#3b0764" stroke="#a855f7" stroke-width="1.5">
    <path d="M930,190 v40 a55,10 0 0 0 110,0 v-40"/>
    <ellipse cx="985" cy="190" rx="55" ry="10"/>
  </g>
  <text x="985" y="222" font-size="14" fill="#f3e8ff" text-anchor="middle">AWS S3</text>

  <!-- Edges -->
  <g stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path id="e1" d="M170,55 H208"/>
    <path id="e2" d="M350,55 H388"/>
    <path id="e3" d="M460,80 V178"/>
    <path d="M170,210 H208"/>
    <path d="M350,210 H388"/>
    <path d="M530,210 H568"/>
    <path d="M710,210 H748"/>
    <path d="M890,210 H928"/>
    <path d="M820,80 V123" stroke-dasharray="5 4"/>
  </g>
  <text x="470" y="98" font-size="11" fill="#d8b4fe">continuous</text>
  <text x="470" y="112" font-size="11" fill="#d8b4fe">deployment</text>
  <text x="830" y="106" font-size="11" fill="#d8b4fe">provisions</text>

  <!-- Animated packets: a commit travelling to production -->
  <circle r="5" fill="#f0abfc" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M100,55 H460 V210"/>
  </circle>
  <!-- A request travelling through the cluster to S3 -->
  <circle r="5" fill="#86efac" filter="url(#glow)">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M100,210 H985"/>
  </circle>
</svg>
